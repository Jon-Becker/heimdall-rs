name: test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest

    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Run Tests
        env:
          RPC_URL: ${{ secrets.RPC_URL || 'https://eth.drpc.org' }}
          WS_RPC_URL: ${{ secrets.WS_RPC_URL || 'wss://arbitrum.drpc.org' }}
        run: make test

  doctest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: make test-doc

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.3
      - name: Run Clippy with Reviewdog
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_REPORTER: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-annotations' }}
        run: |
          # Capture the severity in Cargo's short diagnostics, including errors with a rustc code.
          cargo clippy --quiet --color never --message-format=short -- \
            --allow clippy::new_without_default --allow clippy::redundant_field_names \
            --allow clippy::too_many_arguments --allow clippy::format_in_format_args \
            --allow clippy::should_implement_trait 2>&1 |
            reviewdog '-efm=%f:%l:%c: %t%*[^:]: %m' -name=clippy -reporter="$REVIEWDOG_REPORTER" -filter-mode=nofilter -level=error -tee

  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: make fmt-check

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc
      - run: make check
