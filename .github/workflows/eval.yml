name: eval

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  request-eval:
    name: Post evaluation request instructions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment with evaluation instructions
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- heimdall-eval-request -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            if (!comments.some(comment => comment.body.includes(marker))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `${marker}\n## AI Evaluation Suite\n\nCheck the box below to run the [heimdall-eval](https://github.com/Jon-Becker/heimdall-eval) AI evaluation suite.\n\n- [ ] Run AI Evaluation Suite`,
              });
            }

  resolve-pr:
    name: Validate evaluation request
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- heimdall-eval-request -->') &&
      contains(github.event.comment.body, '- [x] Run AI Evaluation Suite') &&
      (github.event.action == 'created' ||
       !contains(github.event.changes.body.from, '- [x] Run AI Evaluation Suite'))
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      request_comment_id: ${{ steps.pr.outputs.request_comment_id }}
      same_repository: ${{ steps.pr.outputs.same_repository }}
      trusted_requester: ${{ steps.pr.outputs.trusted_requester }}
    steps:
      - name: Resolve pull request head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });

            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('request_comment_id', context.payload.comment.id);
            core.setOutput('same_repository', String(pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo));
            core.setOutput('trusted_requester', String(['admin', 'maintain', 'write'].includes(permission.permission)));

  eval:
    name: run eval
    needs: resolve-pr
    if: >-
      needs.resolve-pr.result == 'success' &&
      needs.resolve-pr.outputs.same_repository == 'true' &&
      needs.resolve-pr.outputs.trusted_requester == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Scope each report to its exact run so reruns cannot overwrite a report
      # already linked from the pull request.
      REPORT_PREFIX: pull/${{ github.event.issue.number }}/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Show evaluation progress on PR
        uses: actions/github-script@v7
        env:
          EVAL_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        with:
          script: |
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.resolve-pr.outputs.request_comment_id }},
              body: [
                '<!-- heimdall-eval-request -->',
                '## AI Evaluation Suite',
                '',
                `:hourglass_flowing_sand: Running the [heimdall-eval](https://github.com/Jon-Becker/heimdall-eval) AI evaluation suite for ${process.env.EVAL_SHA}. [View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
                '',
                '- [x] Run AI Evaluation Suite',
              ].join('\n'),
            });

      - name: Checkout heimdall-rs (PR branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-pr.outputs.head_sha }}

      # Reports compare every PR run with a fresh evaluation of the current main
      # branch, rather than with a prior PR run.
      - name: Checkout heimdall-rs (main baseline)
        uses: actions/checkout@v4
        with:
          ref: main
          path: heimdall-main

      - name: Checkout heimdall-eval
        uses: actions/checkout@v4
        with:
          repository: Jon-Becker/heimdall-eval
          ref: main
          path: heimdall-eval
          token: ${{ secrets.EVAL_REPO_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build candidate heimdall
        run: cargo build --release --bin heimdall

      - name: Build main baseline heimdall
        run: cargo build --release --bin heimdall --manifest-path heimdall-main/Cargo.toml

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Add heimdall to PATH
        run: echo "${{ github.workspace }}/target/release" >> $GITHUB_PATH

      - name: Run main baseline AI evaluation
        working-directory: heimdall-eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PATH="${GITHUB_WORKSPACE}/heimdall-main/target/release:${PATH}" make eval-all
          mv heimdall baseline
          mkdir heimdall
          mv baseline heimdall/baseline

      - name: Run candidate evals
        working-directory: heimdall-eval
        run: make run-all

      - name: Run AI evaluation
        working-directory: heimdall-eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: make eval-all

      - name: Generate HTML evaluation report
        working-directory: heimdall-eval
        run: make report

      # The benchmark report configuration also hosts evaluation reports. Forks
      # never receive AWS credentials, even if this workflow is later enabled
      # for them.
      - name: Resolve report upload target
        id: target
        env:
          IS_FORK: ${{ needs.resolve-pr.outputs.same_repository != 'true' }}
          BUCKET: ${{ vars.BENCH_REPORT_S3_BUCKET }}
          REGION: ${{ vars.BENCH_REPORT_AWS_REGION }}
          ROLE_ARN: ${{ vars.BENCH_REPORT_AWS_ROLE_ARN }}
          BASE_URL: ${{ vars.BENCH_REPORT_BASE_URL }}
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = "true" ]; then
            reason="this is a fork pull request, which is never given AWS access"
          elif [ -z "$BUCKET" ] || [ -z "$REGION" ] || [ -z "$ROLE_ARN" ]; then
            reason="the BENCH_REPORT_* repository variables are not configured"
          elif [ ! -f heimdall-eval/heimdall/report.html ]; then
            reason="the evaluation run produced no HTML report"
          fi

          if [ -n "${reason:-}" ]; then
            echo "Skipping S3 upload: $reason"
            {
              echo "enabled=false"
              echo "skip_reason=$reason"
              echo "url="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${BASE_URL:-https://${BUCKET}.s3.${REGION}.amazonaws.com}"
          {
            echo "enabled=true"
            echo "skip_reason="
            echo "url=${base%/}/${REPORT_PREFIX}/report.html"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        id: aws_credentials
        if: ${{ steps.target.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BENCH_REPORT_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BENCH_REPORT_AWS_REGION }}
          role-session-name: heimdall-eval-${{ github.run_id }}-${{ github.run_attempt }}

      # Report hosting is an optional enhancement. In particular, an AWS role
      # trust-policy change must not make an otherwise successful evaluation
      # appear to have failed.
      - name: Resolve report publication result
        id: report
        if: ${{ !cancelled() }}
        env:
          ENABLED: ${{ steps.target.outputs.enabled }}
          URL: ${{ steps.target.outputs.url }}
          SKIP_REASON: ${{ steps.target.outputs.skip_reason }}
          AWS_CREDENTIALS_OUTCOME: ${{ steps.aws_credentials.outcome }}
        run: |
          set -euo pipefail
          if [ "$ENABLED" != "true" ]; then
            url=""
            reason="$SKIP_REASON"
          elif [ "$AWS_CREDENTIALS_OUTCOME" = "success" ]; then
            url="$URL"
            reason=""
          else
            url=""
            reason="AWS credentials could not be configured; the report is available in the eval-results artifact"
          fi
          {
            echo "url=$url"
            echo "skip_reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Upload evaluation report to S3
        if: ${{ steps.target.outputs.enabled == 'true' && steps.aws_credentials.outcome == 'success' }}
        env:
          BUCKET: ${{ vars.BENCH_REPORT_S3_BUCKET }}
        run: |
          set -euo pipefail
          dest="s3://${BUCKET}/${REPORT_PREFIX}"
          aws s3 cp heimdall-eval/heimdall/report.html "$dest/report.html" \
            --content-type "text/html; charset=utf-8" --only-show-errors
          aws s3 sync heimdall-eval/heimdall/report "$dest/report" \
            --content-type "text/html; charset=utf-8" --only-show-errors

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          EVAL_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          REPORT_URL: ${{ steps.report.outputs.url }}
          REPORT_SKIP_REASON: ${{ steps.report.outputs.skip_reason }}
        with:
          script: |
            const fs = require('fs');
            const evalsJson = JSON.parse(fs.readFileSync('heimdall-eval/heimdall/evals.json', 'utf8'));

            const entries = Object.entries(evalsJson);
            const cfgScores = entries.map(([_, v]) => v.cfg).filter(x => x != null);
            const decompScores = entries.map(([_, v]) => v.decompilation).filter(x => x != null);

            const avgCfg = cfgScores.length ? Math.floor(cfgScores.reduce((a, b) => a + b, 0) / cfgScores.length) : 'N/A';
            const avgDecomp = decompScores.length ? Math.floor(decompScores.reduce((a, b) => a + b, 0) / decompScores.length) : 'N/A';

            const icon = avgDecomp >= 70 ? ':white_check_mark:' : (avgDecomp >= 50 ? ':warning:' : ':x:');

            let tableRows = entries.map(([name, scores]) => {
              const cfg = scores.cfg ?? 'N/A';
              const decomp = scores.decompilation ?? 'N/A';
              return `| ${name} | ${cfg} | ${decomp} |`;
            }).join('\n');


            const body = [
              '<!-- heimdall-eval-request -->',
              `## ${icon} AI Evaluation Suite for ${process.env.EVAL_SHA}`,
              '',
              process.env.REPORT_URL
                ? `:bar_chart: [View the full HTML evaluation report](${process.env.REPORT_URL}).`
                : `:bar_chart: The full HTML evaluation report was not uploaded because ${process.env.REPORT_SKIP_REASON}. Download the \`eval-results\` artifact from the workflow run instead.`,
              `Completed [heimdall-eval](https://github.com/Jon-Becker/heimdall-eval). [View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              '',
              '<details>',
              '<summary>:bar_chart: View evaluation scores</summary>',
              '',
              '| Test Case | CFG | Decompilation |',
              '|-----------|-----|---------------|',
              tableRows,
              `| **Average** | **${avgCfg}** | **${avgDecomp}** |`,
              '</details>',
              '',
              '- [ ] Run AI Evaluation Suite',
            ].join('\n');

            // Reset the checkbox after completion so reviewers can request a rerun.
            // The edited-comment trigger only reacts to unchecked → checked.
            // Replace the request comment so the PR has one live evaluation status.
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.resolve-pr.outputs.request_comment_id }},
              body,
            });

      - name: Show evaluation failure on PR
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.resolve-pr.outputs.request_comment_id }},
              body: [
                '<!-- heimdall-eval-request -->',
                '## :x: AI Evaluation Suite',
                '',
                `The [heimdall-eval](https://github.com/Jon-Becker/heimdall-eval) run failed. See [the workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
                '',
                '- [ ] Run AI Evaluation Suite',
              ].join('\n'),
            });

      - name: Upload eval artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            heimdall-eval/heimdall/*/eval.json
            heimdall-eval/heimdall/*/cfg_eval.json
            heimdall-eval/heimdall/baseline/*/eval.json
            heimdall-eval/heimdall/baseline/*/cfg_eval.json
            heimdall-eval/heimdall/baseline/evals.json
            heimdall-eval/heimdall/evals.json
            heimdall-eval/heimdall/report.html
            heimdall-eval/heimdall/report/
          if-no-files-found: warn
